name: Android Emulator (RFC-0006 process-death + API matrix)

# Series 7 — "real-device legs": the API<33 fallback matrix gets a REAL
# Android runtime. The emulator matrix spans the two fan-out/kernel regimes:
#   API 26 — below the VarHandle 33 floor (the FanoutCompat regime runs)
#   API 33/34 — VarHandle available (the primary regime runs)
# and carries the RFC-0006 LMK/ReattachPolicy gate: a deterministic
# background-process kill (`am kill` — the same ActivityManager kill path
# memory pressure uses) between the two instrumentation phases proves
# CLEAN_REALLOCATE: fresh Weft, sequence reset, zero stale-pointer
# dereferences (a stale deref would SIGSEGV the process and fail the leg).

on:
  push:
    branches: [main, develop]
    paths:
      - 'android/**'
      - 'core/c/**'
      - 'core/kotlin/**'
      - '.github/workflows/android-emulator.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'core/c/**'
      - 'core/kotlin/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-matrix:
    name: Emulator API ${{ matrix.api }} — LMK reattach + regime
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            target: default
            arch: x86_64
          - api: 33
            target: google_apis
            arch: x86_64
          - api: 34
            target: google_apis
            arch: x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android Licenses & Install SDK pieces
        run: |
          set -o pipefail  # no silent-green
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-35" \
            "build-tools;35.0.0" "platform-tools" "emulator" \
            "system-images;android-${{ matrix.api }};${{ matrix.target }};${{ matrix.arch }}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate and Setup Gradle Wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew

      - name: Run instrumentation tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -o pipefail
            cd android
            ./gradlew :sample-app:installDebug :sample-app:installDebugAndroidTest --stacktrace 2>&1 | tee /tmp/emulator_build.log

            adb shell am instrument -w \
              -e class dev.weft.sample.LmkReattachTest#stage_preDeathState \
              dev.weft.sample.test/androidx.test.runner.AndroidJUnitRunner \
              2>&1 | tee /tmp/emulator_stage.log
            grep -q "OK (1 test)" /tmp/emulator_stage.log

            # Process-liveness probe with an API-26-safe fallback (pidof is
            # toybox on modern images but absent on some API-26 builds; ps
            # carries the same signal). Same gate, no weakening.
            pkg_pid() {
              adb shell pidof dev.weft.sample 2>/dev/null || \
                adb shell ps 2>/dev/null | grep -w 'dev.weft.sample' | awk '{print $2}' || true
            }
            PID=$(pkg_pid)
            echo "pre-kill pid: $PID"
            adb shell am kill dev.weft.sample || true
            # API 26 (x86_64, swiftshader) settles slowly: poll until the
            # package is actually gone (up to 30s) instead of a fixed sleep,
            # so the verify phase can never attach to the dying process.
            # The assertions below are unchanged — only the wait is patient.
            for i in $(seq 1 10); do
              sleep 3
              if [ -z "$(pkg_pid)" ]; then break; fi
              if [ "$i" -eq 10 ]; then
                echo "process still alive after kill — retrying am kill once"
                adb shell am kill dev.weft.sample || true
                sleep 5
              fi
            done
            echo "post-kill pid: $(pkg_pid)"

            adb shell am instrument -w \
              -e class dev.weft.sample.LmkReattachTest#verify_cleanReallocateAfterProcessDeath \
              dev.weft.sample.test/androidx.test.runner.AndroidJUnitRunner \
              2>&1 | tee /tmp/emulator_verify.log
            grep -q "OK (1 test)" /tmp/emulator_verify.log

      - name: Archive emulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-api-${{ matrix.api }}-logs
          path: |
            /tmp/emulator_*.log
