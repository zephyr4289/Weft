name: Android Packages CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Android Gradle Matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android Licenses & Install NDK / CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate and Setup Gradle Wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew

      - name: Run Unit Tests
        id: run_tests
        run: |
          cd android
          ./gradlew test --stacktrace --info 2>&1 | tee /tmp/gradle_test_output.log

      - name: Assemble Release (AAR + R8 minified APK across 3 ABIs)
        id: assemble_release
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace 2>&1 | tee -a /tmp/gradle_test_output.log

      - name: Publish to Maven Local
        run: |
          cd android
          ./gradlew publishToMavenLocal --stacktrace

      - name: Post Diagnostic Summary to Commit Comments on Failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f /tmp/gradle_test_output.log ]; then
            # Extract last 80 lines and any ERROR/FAILURE lines
            SUMMARY=$(tail -n 80 /tmp/gradle_test_output.log)
            gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments \
              -f body="### ❌ Android CI Failure Diagnostics
\`\`\`text
$SUMMARY
\`\`\`" || true
          fi

      - name: Archive Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-aar-and-apk
          path: |
            android/weft-core/build/outputs/aar/
            android/weft-compose/build/outputs/aar/
            android/sample-app/build/outputs/apk/
            android/sample-app/build/outputs/mapping/
            android/*/build/reports/tests/
            android/*/build/test-results/
