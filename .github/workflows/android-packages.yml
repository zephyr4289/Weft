name: Android Packages CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Android Gradle Matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Binding parity guard (core/kotlin <-> android mirror)
        run: bash ci/scripts/run_binding_parity.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android Licenses & Install NDK / CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Run Unit Tests
        id: run_tests
        run: |
          set -o pipefail  # tee must not swallow the build exit code
          cd android
          ./gradlew test --stacktrace --info 2>&1 | tee /tmp/gradle_test_output.log

      - name: Assemble Release (AAR + R8 minified APK across 3 ABIs)
        id: assemble_release
        run: |
          set -o pipefail  # tee must not swallow the build exit code
          cd android
          ./gradlew assembleRelease --stacktrace 2>&1 | tee -a /tmp/gradle_test_output.log

      - name: Publish to Maven Local
        run: |
          cd android
          ./gradlew publishToMavenLocal --stacktrace

      - name: Post Diagnostic Summary to Step Summary and Commit Comments on Failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f /tmp/gradle_test_output.log ]; then
            echo "### Gradle Output Summary" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 /tmp/gradle_test_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          python3 -c "
          import os, urllib.request, json
          token = os.environ.get('GH_TOKEN')
          repo = '${{ github.repository }}'
          sha = '${{ github.sha }}'
          log_content = 'No log found'
          if os.path.exists('/tmp/gradle_test_output.log'):
              with open('/tmp/gradle_test_output.log', 'r') as f:
                  lines = f.readlines()
                  log_content = ''.join(lines[-120:])
          payload = {'body': '### ❌ Android CI Failure Diagnostics\n\`\`\`text\n' + log_content + '\n\`\`\`'}
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/commits/{sha}/comments',
              data=json.dumps(payload).encode('utf-8'),
              headers={'Authorization': f'Bearer {token}', 'User-Agent': 'Weft-CI', 'Accept': 'application/vnd.github.v3+json'}
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  print('Posted comment successfully')
          except Exception as e:
              print('Failed to post comment:', e)
          "

      - name: Archive Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-aar-and-apk
          path: |
            android/weft-core/build/outputs/aar/
            android/weft-compose/build/outputs/aar/
            android/sample-app/build/outputs/apk/
            android/sample-app/build/outputs/mapping/
            android/*/build/reports/tests/
            android/*/build/test-results/

      # -----------------------------------------------------------------------
      # LOG PUBLISH — runs on every trigger (PR + push + dispatch).
      # Branch: ci/logs   Path: android-packages/{sha}/build.log
      # No more guessing what failed — the exact log is always committed.
      # -----------------------------------------------------------------------
      - name: Publish logs → ci/logs branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          SHA="${{ github.sha }}"
          EVENT="${{ github.event_name }}"
          STATUS="${{ job.status }}"
          LOG_DIR="android-packages/${SHA}"

          # Work in a temp dir so we don't dirty the workspace
          WORK=$(mktemp -d)
          cp -r .git "$WORK/.git"
          cd "$WORK"

          git fetch origin ci/logs 2>/dev/null && git checkout ci/logs || {
            git checkout --orphan ci/logs
            git rm -rf . 2>/dev/null || true
            git commit --allow-empty -m "chore(ci): init ci/logs branch" || true
          }

          mkdir -p "$LOG_DIR"

          # status envelope
          {
            echo "workflow: android-packages"
            echo "job:      Android Gradle Matrix"
            echo "status:   $STATUS"
            echo "sha:      $SHA"
            echo "event:    $EVENT"
            echo "run:      ${{ github.run_number }}"
            echo "date:     $(date -u)"
            echo "ref:      ${{ github.ref }}"
          } > "$LOG_DIR/status.txt"

          # full build log
          [ -f /tmp/gradle_test_output.log ] && cp /tmp/gradle_test_output.log "$LOG_DIR/build.log" || echo "(no log)" > "$LOG_DIR/build.log"

          git add -f "$LOG_DIR/"
          git commit -m "ci(android-packages): $STATUS [${SHA:0:8}] event=$EVENT run=${{ github.run_number }}" || true
          git push origin ci/logs || true

      # Keep the legacy ci/android-status branch for backward compat
      - name: Publish CI Result Branch (legacy)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci/android-status
          mkdir -p .ci-status
          echo "CONCLUSION=${{ job.status }}" > .ci-status/status.txt
          echo "SHA=${{ github.sha }}" >> .ci-status/status.txt
          echo "DATE=$(date -u)" >> .ci-status/status.txt
          if [ -f /tmp/gradle_test_output.log ]; then
            cp /tmp/gradle_test_output.log .ci-status/gradle_test_output.log
          fi
          git add -f .ci-status/
          git commit -m "ci: android status [${{ job.status }}] for ${{ github.sha }}" || true
          git push -f origin ci/android-status || true
