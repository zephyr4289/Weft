name: Extreme Test Matrix & Performance Gate

# Weft Extreme Testing Suite — adapted from the founding extreme-test strategy
# for Weft's 3-language kernel + litmus + B-suite + W-suite + tools surface.
#
# Design goals (per user):
#   1. Parallel shards — every test area runs concurrently to minimize wall-clock
#   2. Performance gate — committed code never silently degrades performance
#      (W-suite P99 compared against pinned baseline; >15% regression = FAIL)
#   3. Report persistence — every run commits full logs to `ci-report` branch
#      so they can be pulled and analyzed later
#   4. Path-aware routing — a shard only wakes up when a change can actually
#      affect what it gates (see the `changes` job + ci/README.md contract).
#      Every gate still runs on every change that can affect it: strictness
#      is preserved by construction, irrelevant runs are simply not spent.
#
# Trigger: every push to main/develop, every PR to main, manual dispatch.
# Manual dispatch always runs the FULL matrix (routing outputs are forced on).

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deep:
        description: 'Run nightly-deep matrix (long thermal, 5x litmus, TSAN)'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

permissions:
  contents: write        # needed to push to ci-report branch
  pull-requests: write   # needed to post PR comments on regression
  security-events: write # CodeQL
  actions: write         # needed by dispatch-deep to trigger nightly-deep.yml

concurrency:
  group: extreme-test-${{ github.ref }}
  # PRs: a newer push to the same PR supersedes the older run — the newest
  # head is the only SHA that can merge, so cancelling saves runner minutes
  # without losing any report that matters (each PR keeps its latest run).
  # Pushes to main/develop: never cancel — the ci-report entry must land.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: '3.12'
  RUST_TOOLCHAIN: 'stable'
  NODE_VERSION: '24'

jobs:

  # ===========================================================================
  # 0. CHANGE ROUTING — decide which shards this change set can affect.
  #    Runs in parallel with the gatekeeper (seconds, off the critical path).
  #    Filter ownership is documented per shard in ci/README.md — a new shard
  #    MUST add its filter there and here in the same PR.
  # ===========================================================================
  changes:
    name: Change routing (paths)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      any_code: ${{ steps.routing.outputs.any_code }}
      formal: ${{ steps.routing.outputs.formal }}
      forensic: ${{ steps.routing.outputs.forensic }}
      site: ${{ steps.routing.outputs.site }}
      canonical: ${{ steps.routing.outputs.canonical }}
      silent_green: ${{ steps.routing.outputs.silent_green }}
      any_gate: ${{ steps.routing.outputs.any_gate }}
      matrix: ${{ steps.routing.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # paths-filter needs history to diff push events

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            any_code:
              - 'core/**'
              - 'litmus/**'
              - 'bench/**'
              - 'tools/**'
              - 'probes/**'
              - 'packages/**'
              - 'fixtures/**'
              - 'heddles/**'
              - 'python/**'
              - 'android/**'
              - 'apple/**'
              - 'demos/**'
              - 'scripts/**'
              - 'Makefile'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'ci/**'
              - '.github/workflows/extreme-test.yml'
            formal:
              - 'formal/**'
              - 'core/**'
              - 'ci/scripts/run_formal_shard.sh'
            forensic:
              - 'reports/**'
              - 'ci/scripts/run_forensic_scan_shard.sh'
            site:
              - 'tools/make_site.py'
              - 'bench/results.json'
              - 'bench/results/**'
              - 'Makefile'
              - 'ci/scripts/run_site_determinism_shard.sh'
            canonical:
              - 'bench/results.json'
              - 'ci/scripts/run_canonical_audit_shard.sh'
            silent_green:
              - 'ci/**'
              - '.github/workflows/**'

      - name: Compute routing (filters, or full matrix on manual dispatch)
        id: routing
        env:
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          F_ANY_CODE: ${{ steps.filter.outputs.any_code }}
          F_FORMAL: ${{ steps.filter.outputs.formal }}
          F_FORENSIC: ${{ steps.filter.outputs.forensic }}
          F_SITE: ${{ steps.filter.outputs.site }}
          F_CANONICAL: ${{ steps.filter.outputs.canonical }}
          F_SILENT_GREEN: ${{ steps.filter.outputs.silent_green }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          is_dispatch = os.environ.get("IS_DISPATCH") == "true"
          routes = {
              "any_code": is_dispatch or os.environ.get("F_ANY_CODE") == "true",
              "formal": is_dispatch or os.environ.get("F_FORMAL") == "true",
              "forensic": is_dispatch or os.environ.get("F_FORENSIC") == "true",
              "site": is_dispatch or os.environ.get("F_SITE") == "true",
              "canonical": is_dispatch or os.environ.get("F_CANONICAL") == "true",
              "silent_green": is_dispatch or os.environ.get("F_SILENT_GREEN") == "true",
          }
          all_shards = [
              {"shard": "litmus-c", "description": "L1-L8 litmus suite, C kernel (8 tests, 2 build modes)", "script": "ci/scripts/run_litmus_shard.sh", "args": "c", "needs_rust": False, "filter": "any_code"},
              {"shard": "litmus-rust", "description": "L1-L8 litmus suite, Rust kernel (8 tests, release)", "script": "ci/scripts/run_litmus_shard.sh", "args": "rust", "needs_rust": True, "filter": "any_code"},
              {"shard": "litmus-ts", "description": "L1-L8 litmus suite, TS kernel (with EXPOSURE-RETRY)", "script": "ci/scripts/run_litmus_shard.sh", "args": "ts", "needs_rust": False, "filter": "any_code"},
              {"shard": "bench-b-c", "description": "B1-B5 benchmarks, C kernel", "script": "ci/scripts/run_bench_shard.sh", "args": "c", "needs_rust": False, "filter": "any_code"},
              {"shard": "bench-b-rust", "description": "B1-B5 benchmarks, Rust kernel", "script": "ci/scripts/run_bench_shard.sh", "args": "rust", "needs_rust": True, "filter": "any_code"},
              {"shard": "bench-b-ts", "description": "B1-B5 benchmarks, TS kernel", "script": "ci/scripts/run_bench_shard.sh", "args": "ts", "needs_rust": False, "filter": "any_code"},
              {"shard": "wsuite", "description": "W1-W5 × A/B/C/D = 20 cells, P99 + alloc assertions", "script": "ci/scripts/run_wsuite_shard.sh", "args": "", "needs_rust": False, "filter": "any_code"},
              {"shard": "thermal-proxy", "description": "W2 × 4 backends × 120s sustained, decay curves", "script": "ci/scripts/run_thermal_shard.sh", "args": "120", "needs_rust": False, "filter": "any_code"},
              {"shard": "tools-interop", "description": "C→C, C→Rust, Rust→Rust, Rust→C record/replay", "script": "ci/scripts/run_tools_interop_shard.sh", "args": "", "needs_rust": True, "filter": "any_code"},
              {"shard": "ports-validate", "description": "Kotlin + Swift + Dart + TS heddles structural validator", "script": "ci/scripts/run_ports_validate_shard.sh", "args": "", "needs_rust": False, "filter": "any_code"},
              {"shard": "silent-green-audit", "description": "pipefail in every shard + every workflow pipeline", "script": "ci/scripts/run_silentgreen_shard.sh", "args": "", "needs_rust": False, "filter": "silent_green"},
              {"shard": "browser-sab", "description": "chromium: crossOriginIsolated + SAB kernel roundtrip + 1W/2R fanout", "script": "ci/scripts/run_browser_sab_shard.sh", "args": "", "needs_rust": False, "filter": "any_code"},
              {"shard": "fanout-concurrent", "description": "1 writer + 4 reader workers, integrity-gated + daisy-chain", "script": "ci/scripts/run_fanout_shard.sh", "args": "", "needs_rust": False, "filter": "any_code"},
              {"shard": "fanout-native", "description": "C/Rust fan-out ring: F-series + torture x2 regimes + Loom + xlang", "script": "ci/scripts/run_fanout_native_shard.sh", "args": "", "needs_rust": True, "filter": "any_code"},
              {"shard": "turbo-native", "description": "RFC-0012 TLEL: T/U-series x sanitizers + seq_cst, T-bench smoke, zero-regression guardrail", "script": "ci/scripts/run_turbo_native_shard.sh", "args": "", "needs_rust": False, "filter": "any_code"},
              {"shard": "gpu-native", "description": "RFC-0003 spike: GPU-series + gpu-probe full dispatch (lavapipe ICD)", "script": "ci/scripts/run_gpu_native_shard.sh", "args": "", "needs_rust": False, "filter": "any_code"},
              {"shard": "verifiedweft", "description": "RFC 0005: V-series x3 kernels + C<->TS interop + tamper rejection", "script": "ci/scripts/run_verifiedweft_shard.sh", "args": "", "needs_rust": True, "filter": "any_code"},
              {"shard": "site-determinism", "description": "make site double-render, byte-identical sha256 check", "script": "ci/scripts/run_site_determinism_shard.sh", "args": "", "needs_rust": False, "filter": "site"},
              {"shard": "forensic-scan", "description": "PAST-CROPBOX scan at 611.5pt, whole document", "script": "ci/scripts/run_forensic_scan_shard.sh", "args": "", "needs_rust": False, "filter": "forensic"},
              {"shard": "canonical-audit", "description": "bench/results.json sha256 = 16b5c663 invariant", "script": "ci/scripts/run_canonical_audit_shard.sh", "args": "", "needs_rust": False, "filter": "canonical"},
              {"shard": "perf-regression", "description": "W-suite P99 vs pinned baseline; >15% drop = FAIL", "script": "ci/scripts/run_perf_regression_shard.sh", "args": "", "needs_rust": False, "filter": "any_code"},
              {"shard": "chaos", "description": "Deterministic chaos engine — stepped shapes x2 regimes + ASAN + free 2M", "script": "ci/scripts/run_chaos_shard.sh", "args": "", "needs_rust": False, "filter": "any_code"},
              {"shard": "chaos-parity", "description": "Cross-language chaos parity — C==TS==JVM==Dart byte-identical verdicts", "script": "ci/scripts/run_chaos_parity.sh", "args": "", "needs_rust": False, "filter": "any_code"},
              {"shard": "formal", "description": "TLA+ proofs — FanoutSeqlock + ReattachPolicy (TLC, pinned jar)", "script": "ci/scripts/run_formal_shard.sh", "args": "", "needs_rust": False, "filter": "formal"},
              {"shard": "simd-blend", "description": "Q12 raster blend: C golden gates + xlang-blend cross-language digests + bench", "script": "ci/scripts/run_blend_shard.sh", "args": "", "needs_rust": False, "filter": "any_code"},
              {"shard": "qos-worklet", "description": "thread QoS flags honesty + native worklet conformance (20k ticks, order, latency)", "script": "ci/scripts/run_qos_shard.sh", "args": "", "needs_rust": False, "filter": "any_code"},
              {"shard": "guardian", "description": "Telemetry Guardian — must-bite selftest + wire probe + 3% throughput + crash audit", "script": "ci/scripts/run_guardian_shard.sh", "args": "", "needs_rust": False, "filter": "any_code"},
              {"shard": "sanitizers", "description": "TIER4 memory-safety audit: ASan+UBSan + TSan, zero findings", "script": "ci/scripts/run_sanitizers_shard.sh", "args": "", "needs_rust": False, "filter": "any_code"},
              {"shard": "trace-standard", "description": "RFC 0014 .weftrec v4: codec conformance + cross-port trace byte-identity (C==TS, VM legs via toolchain workflows) + JSON schema shape", "script": "ci/scripts/run_trace_shard.sh", "args": "", "needs_rust": False, "filter": "any_code"},
              {"shard": "ipc-mesh", "description": "RFC-0016 zero-copy IPC mesh: sealed memfd + SCM_RIGHTS + lock-free registry + crash healing + 100k cross-process torture x sanitizers", "script": "ci/scripts/run_ipc_mesh_shard.sh", "args": "", "needs_rust": False, "filter": "any_code"},
              {"shard": "revoke-stress", "description": "Issue #16 Tier 1 Task 5 — revocation handshake stress: 100K handshakes + measured ceiling + ASAN + TSAN", "script": "ci/scripts/run_revoke_stress_shard.sh", "args": "", "needs_rust": False, "filter": "any_code"},
              {"shard": "ffi-fuzz", "description": "Issue #16 Tier 1 Task 4 — FFI-boundary structured fuzz: C kernel API 200K ops + ASAN + C<->TS boundary", "script": "ci/scripts/run_ffi_fuzz_shard.sh", "args": "", "needs_rust": False, "filter": "any_code"},
            {"shard": "heterogeneous", "description": "RFC-0016 Series 10: DMA-BUF rings, GPU external-memory wraps (fd-road zero-copy), AF_XDP state machine + uring delegation, WTS1 tensor bridge, camera seams, hetero capstone (lavapipe ICD)", "script": "ci/scripts/run_heterogeneous_shard.sh", "args": "", "needs_rust": False, "filter": "any_code"},
              {"shard": "memory-model-formal", "description": "Axis 1: herd7 ARMv8 + RISC-V RVWMO CAT formal models + litmus7 ARM execution proofs", "script": "ci/scripts/run_memory_model_shard.sh", "args": "", "needs_rust": False, "filter": "any_code"},
              {"shard": "wcet-audit", "description": "Axis 2: Static instruction disassembly audit + WCET certificates + SCHED_DEADLINE TLA+ model", "script": "ci/scripts/run_wcet_shard.sh", "args": "", "needs_rust": False, "filter": "any_code"},
              {"shard": "recovery-self-stabilizing", "description": "Axis 3: Self-stabilizing ring recovery + health check + 10k fault injection cycles + TLA+ recovery proof", "script": "ci/scripts/run_recovery_shard.sh", "args": "", "needs_rust": False, "filter": "any_code"},
              {"shard": "device-spectrum", "description": "doc-007: Device-spectrum profiling, F16 quantization, dirty-mask, and zero-copy render bridge", "script": "ci/scripts/run_device_spectrum_shard.sh", "args": "", "needs_rust": False, "filter": "any_code"},
              {"shard": "tensor-fabric", "description": "RFC-0021 weft-tensor: WT view/arena/ring suites + golden bit-exactness + MPSC/SPMC/MMPC tearing stress + fork torture (plain + ASAN + TSAN)", "script": "ci/scripts/run_tensor_shard.sh", "args": "", "needs_rust": False, "filter": "any_code"},
              {"shard": "weft-tensor", "description": "RFC-0017 Pillar 2: NPU/GPU accelerator adapters — tensor view ABI, Vulkan dma-buf bridge (alias canary + bit-exact frozen kernel), Metal wraps, zero-copy ONNX bridge (verified table mirror + pooled no-alloc run), ggml buffer-type + windowing, E2E latency bench (lavapipe ICD)", "script": "ci/scripts/run_weft_tensor_shard.sh", "args": "", "needs_rust": False, "filter": "any_code"},
              {"shard": "series10", "description": "Series 10 Observability Fabric: RFC 0016 flight recorder, RFC 0017 flow operators, RFC 0018 sensor fusion, RFC 0019 replay, RFC 0020 trend", "script": "ci/scripts/run_series10_shard.sh", "args": "", "needs_rust": False, "filter": "any_code"},
              {"shard": "weftc", "description": "RFC-0017 schema compiler: WL/WH/WD suites + goldens + verify-header drift gate (plain + ASAN)", "script": "ci/scripts/run_weftc_shard.sh", "args": "", "needs_rust": False, "filter": "any_code"},
              {"shard": "weftc-codegen", "description": "Project weftc Pillar 1: Native (C11/Rust/WGSL/GLSL) & Managed (TS/Python/Swift/Dart/React/Flutter) codegen suites + parity matrix + E2E kernel roundtrip", "script": "ci/scripts/run_weftc_codegen_shard.sh", "args": "", "needs_rust": True, "filter": "any_code"},
              {"shard": "weft-tensor-managed", "description": "Project weft-tensor Pillar 2: WTR1 layout, TS/Python ingestion engines, DLPack/NumPy bridge, cross-language parity, React/Flutter AI hooks/widgets, 120 FPS flight demo, alloc probes", "script": "ci/scripts/run_weft_tensor_managed_shard.sh", "args": "", "needs_rust": False, "filter": "any_code"},
          ]
          active = [s for s in all_shards if routes.get(s["filter"], False)]
          any_gate = bool(active)
          gh_out = os.environ.get("GITHUB_OUTPUT")
          with open(gh_out, "a") as f:
              for k, v in routes.items():
                  f.write(f"{k}={str(v).lower()}\n")
              f.write(f"any_gate={str(any_gate).lower()}\n")
              f.write(f"matrix={json.dumps(active if any_gate else [all_shards[0]])}\n")
          PY

  # ===========================================================================
  # 1. GATEKEEPER — compile all three kernels first; skip downstream if it fails
  #    Shards no longer WAIT on this job (each shard builds its own kernels and
  #    `if: success() || failure()` already meant they ran on build failure);
  #    starting them in parallel strictly reduces wall-clock with identical
  #    pass/fail semantics.
  # ===========================================================================
  build-and-compile:
    name: Build (gatekeeper)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.any_code == 'true'
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      build-status: ${{ steps.build.outcome }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/rust

      - name: Cache pip + tectonic
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/Tectonic
            ~/.local/bin/tectonic
          key: ${{ runner.os }}-py-tectonic-v1
          restore-keys: |
            ${{ runner.os }}-py-tectonic-

      - name: Install Python deps (PyYAML, PyMuPDF, psutil)
        run: pip install --quiet pyyaml pymupdf psutil

      - name: Install tectonic + pandoc (for site + report scans)
        run: |
          set -o pipefail  # no silent-green: a failed curl must fail the step
          if [ ! -x "$HOME/.local/bin/tectonic" ]; then
            curl -sSL https://drop-sh.fullyjustified.net | sh
            mkdir -p "$HOME/.local/bin"
            mv tectonic "$HOME/.local/bin/"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq && sudo apt-get install -y -qq pandoc

      - name: Build all three kernels
        id: build
        run: |
          set -o pipefail
          mkdir -p ci/run-artifacts
          make build 2>&1 | tee ci/run-artifacts/build.log
          echo "build-status=success" >> $GITHUB_OUTPUT

      - name: Handle build failure — post comment + early-exit
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail  # the grep|tail diagnostic must not mask rc semantics
          ERROR_LOG=$(grep -A 2 -B 2 -iE "error|panic|fatal" ci/run-artifacts/build.log | tail -n 50 || echo "Could not extract errors.")
          BODY=$(printf "### ❌ Build failed (gatekeeper)\n\`\`\`text\n%s\n\`\`\`" "$ERROR_LOG")
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$BODY" || true
          exit 1

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-build
          path: ci/run-artifacts/build.log
          retention-days: 14

  # ===========================================================================
  # 2. CODEQL STATIC ANALYSIS — security + quality on the kernel languages
  # ===========================================================================
  codeql-analysis:
    name: CodeQL (cpp, rust, python)
    needs: [changes, build-and-compile]
    if: needs.changes.outputs.any_code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain (CodeQL Rust tracer needs it)
        uses: dtolnay/rust-toolchain@stable

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: cpp, python
          queries: security-and-quality

      - name: Manual build for CodeQL tracing
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gcc make
          cd core/c && make

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

  # ===========================================================================
  # 3. PARALLEL TEST MATRIX — every shard runs concurrently
  #    Each shard carries a `filter` key naming its change-route (see the
  #    `changes` job). A shard runs iff its route is on. Filters err toward
  #    running MORE, never less: any path that can affect a gate triggers it.
  #    NOTE: shards no longer `needs` the gatekeeper — they are self-contained
  #    (each builds its own kernels) and previously ran even on build failure
  #    (`if: success() || failure()`). Starting them immediately is strictly
  #    faster with identical gating semantics.
  # ===========================================================================
  test-matrix:
    name: ${{ matrix.shard }}
    needs: changes
    if: "!cancelled() && needs.changes.outputs.any_gate == 'true'"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache pip downloads (pyyaml, pymupdf, psutil)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-extreme-${{ runner.os }}-v1
          restore-keys: pip-extreme-${{ runner.os }}-

      - name: Set up Rust toolchain
        if: matrix.needs_rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache pnpm store (fanout-native, browser-sab, simd-blend, verifiedweft, ffi-fuzz, litmus-c, series10)
        if: matrix.shard == 'fanout-native' || matrix.shard == 'browser-sab' || matrix.shard == 'simd-blend' || matrix.shard == 'verifiedweft' || matrix.shard == 'ffi-fuzz' || matrix.shard == 'litmus-c' || matrix.shard == 'series10'
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Set up pnpm + build @weft/core dist (fanout-native, browser-sab, simd-blend, verifiedweft, ffi-fuzz, litmus-c, series10)
        if: matrix.shard == 'fanout-native' || matrix.shard == 'browser-sab' || matrix.shard == 'simd-blend' || matrix.shard == 'verifiedweft' || matrix.shard == 'ffi-fuzz' || matrix.shard == 'litmus-c' || matrix.shard == 'series10'
        run: |
          npm i -g pnpm@9
          pnpm install --frozen-lockfile
          pnpm --filter @weft/core build

      - name: Cache Rust build
        if: matrix.needs_rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/rust

      - name: Install Python deps
        run: pip install --quiet pyyaml pymupdf psutil

      - name: Install tectonic + pandoc (forensic-scan + site shards)
        if: matrix.shard == 'forensic-scan' || matrix.shard == 'site-determinism'
        run: |
          set -o pipefail  # no silent-green: a failed curl must fail the step
          if [ ! -x "$HOME/.local/bin/tectonic" ]; then
            curl -sSL https://drop-sh.fullyjustified.net | sh
            mkdir -p "$HOME/.local/bin"
            mv tectonic "$HOME/.local/bin/"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq && sudo apt-get install -y -qq pandoc

      - name: Install Vulkan ICD + tools (gpu-native, heterogeneous, weftc-codegen shards)
        if: matrix.shard == 'gpu-native' || matrix.shard == 'heterogeneous' || matrix.shard == 'weftc-codegen'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan1 libvulkan-dev mesa-vulkan-drivers glslang-tools spirv-tools vulkan-tools

      - name: Run shard
        id: shard_run
        run: |
          set -o pipefail  # tee must not swallow the build exit code
          mkdir -p ci/run-artifacts
          chmod +x ${{ matrix.script }}
          ./${{ matrix.script }} ${{ matrix.args }} 2>&1 | tee ci/run-artifacts/shard-${{ matrix.shard }}.log
          echo "shard-status=${{ matrix.shard }}" >> $GITHUB_OUTPUT

      - name: Format shard log header
        if: always()
        run: |
          mkdir -p ci/run-artifacts
          touch ci/run-artifacts/shard-${{ matrix.shard }}.log
          STATUS="FAILED ❌"
          if [ "${{ steps.shard_run.outcome }}" == "success" ]; then
            STATUS="PASSED ✅"
          fi
          {
            echo "=================================================="
            echo "SHARD: ${{ matrix.shard }}"
            echo "DESCRIPTION: ${{ matrix.description }}"
            echo "STATUS: $STATUS"
            echo "COMMIT: ${{ github.sha }}"
            echo "RUN: ${{ github.run_number }}"
            echo "=================================================="
            echo ""
          } > /tmp/header.txt
          cat /tmp/header.txt ci/run-artifacts/shard-${{ matrix.shard }}.log > /tmp/combined.log 2>/dev/null || cat /tmp/header.txt > /tmp/combined.log
          mv /tmp/combined.log ci/run-artifacts/shard-${{ matrix.shard }}.log

      - name: Upload shard log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.shard }}
          path: ci/run-artifacts/shard-${{ matrix.shard }}.log
          retention-days: 14

      - name: Upload shard results JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.shard }}
          path: |
            ci/run-artifacts/shard-${{ matrix.shard }}-results.json
            litmus/results.json
            bench/results/wsuite-x86_64-sandbox.json
            bench/results/wsuite-thermal-x86_64-sandbox.json
          if-no-files-found: ignore
          retention-days: 14

  # ===========================================================================
  # 4. AGGREGATION — download all shard logs, commit to ci-report branch
  #    Only runs when at least one gate ran (any_gate). When the routing job
  #    itself fails, this job is skipped and the workflow shows red — a
  #    routing failure can never silently green-wash a run.
  # ===========================================================================
  aggregate-and-publish:
    name: Aggregate → ci-report branch
    runs-on: ubuntu-latest
    needs: [changes, build-and-compile, codeql-analysis, test-matrix]
    if: always() && needs.changes.outputs.any_gate == 'true'
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history for branch ops

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download all shard logs
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: log-*
          path: ci/downloaded-logs
          merge-multiple: true

      - name: Download all shard results JSON
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: results-*
          path: ci/downloaded-results
          merge-multiple: true

      - name: Aggregate logs + compute overall status
        id: aggregate
        run: |
          python3 ci/scripts/aggregate_reports.py \
            --logs-dir ci/downloaded-logs \
            --results-dir ci/downloaded-results \
            --run-number ${{ github.run_number }} \
            --commit-sha ${{ github.sha }} \
            --out-dir ci/final-report || true

          # Read the overall status from the JSON summary
          OVERALL=$(python3 -c "import json; print(json.load(open('ci/final-report/summary.json'))['overall_status'])")
          echo "overall-status=$OVERALL" >> $GITHUB_OUTPUT
          echo "Overall status: $OVERALL"

      - name: Push to ci-report branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail  # no silent-green in the ci-report bookkeeping
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch or create ci-report branch (grep -q rc=1 = branch absent,
          # the intended fallthrough — guarded explicitly below)
          BRANCH_EXISTS=$(git ls-remote --heads origin ci-report | grep -c ci-report || true)
          if [ "${BRANCH_EXISTS:-0}" != "0" ]; then
            git fetch origin ci-report
            git checkout ci-report
            git pull --rebase origin ci-report || true
          else
            git checkout --orphan ci-report
            git rm -rf . || true
            echo "# Weft CI Reports" > README.md
            echo "" >> README.md
            echo "This branch holds the full audit trail of CI runs. See \`runs/\` for per-run logs." >> README.md
            git add README.md
            git commit -m "chore(ci): initialize ci-report branch" || true
          fi

          # Stage this run's artifacts
          RUN_DIR="runs/run-$(printf '%05d' ${{ github.run_number }})"
          mkdir -p "$RUN_DIR"

          # Combined log
          cp ci/final-report/combined.log "$RUN_DIR/combined.log"
          cp ci/final-report/combined.log "latest.log"

          # Per-shard logs
          mkdir -p "$RUN_DIR/shards"
          cp ci/downloaded-logs/shard-*.log "$RUN_DIR/shards/" 2>/dev/null || true

          # Structured results
          cp ci/final-report/summary.json "$RUN_DIR/summary.json"
          cp ci/final-report/summary.json "latest-summary.json"

          # Per-shard results JSON
          mkdir -p "$RUN_DIR/results"
          cp ci/downloaded-results/*.json "$RUN_DIR/results/" 2>/dev/null || true
          cp -r ci/downloaded-results "$RUN_DIR/results-raw" 2>/dev/null || true

          # Build log
          cp ci/downloaded-logs/build.log "$RUN_DIR/build.log" 2>/dev/null || true

          git add "$RUN_DIR" latest.log latest-summary.json
          git commit -m "test(ci): run #${{ github.run_number }} [${{ steps.aggregate.outputs.overall-status }}] [skip ci]" || true
          git push origin ci-report || true

      - name: Post failure comment on triggering commit
        if: steps.aggregate.outputs.overall-status == 'FAILED'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ERRORS=$(python3 -c "
          import json
          s = json.load(open('ci/final-report/summary.json'))
          for shard, r in s.get('shards', {}).items():
              if r.get('status') != 'PASSED':
                  print(f'{shard}: {r.get(\"status\")} — {r.get(\"tail\",\"\")[:200]}')
          ")
          BODY=$(printf "### ❌ Extreme Test Suite Failure (Run #%s)\n\nDetailed traces committed to \`ci-report\` branch (\`runs/run-%05d/\`).\n\n\`\`\`text\n%s\n\`\`\`" "${{ github.run_number }}" "${{ github.run_number }}" "$ERRORS")
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$BODY" || true

      - name: Post perf-regression comment on PR
        if: steps.aggregate.outputs.overall-status == 'FAILED' && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f ci/final-report/perf-regression.md ]; then
            gh pr comment ${{ github.event.pull_request.number }} \
              --body-file ci/final-report/perf-regression.md || true
          fi

      - name: Fail the workflow if overall status is FAILED
        if: steps.aggregate.outputs.overall-status == 'FAILED'
        run: exit 1

  # ===========================================================================
  # 5. DISPATCH DEEP — wire the previously-dead `deep` input: dispatching this
  #    workflow with deep=true now actually triggers the nightly-deep matrix
  #    on the same branch. (Previously the input was declared but never read.)
  # ===========================================================================
  dispatch-deep:
    name: Trigger nightly-deep matrix (dispatch deep=true)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.deep == 'true'
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Dispatch nightly-deep on this ref
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Dispatching Nightly Deep Annihilation Matrix on ${{ github.ref_name }}"
          gh workflow run nightly-deep.yml --ref "${{ github.ref_name }}"
          echo "→ https://github.com/${{ github.repository }}/actions/workflows/nightly-deep.yml"
