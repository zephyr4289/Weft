name: Flutter Packages CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flutter-test:
    name: Flutter & Dart FFI Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Binding parity guard (core/dart <-> flutter reference)
        run: bash ci/scripts/run_binding_parity.sh

      - name: Initialize Log
        run: |
          touch /tmp/flutter_build_output.log
          echo "=== Starting Flutter CI ===" >> /tmp/flutter_build_output.log

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Compile Native C Kernel (libweft.so)
        run: |
          set -o pipefail  # tee must not swallow the build exit code
          mkdir -p packages/flutter_weft/build
          gcc -shared -fPIC -O3 -Icore/c core/c/weft.c -o packages/flutter_weft/libweft.so 2>&1 | tee -a /tmp/flutter_build_output.log
          cp packages/flutter_weft/libweft.so /tmp/libweft.so
          sudo cp packages/flutter_weft/libweft.so /usr/local/lib/libweft.so
          sudo ldconfig || true

      - name: Install Dependencies
        run: |
          set -o pipefail  # tee must not swallow the build exit code
          cd packages/flutter_weft
          flutter pub get 2>&1 | tee -a /tmp/flutter_build_output.log

      - name: Dart Analyze
        run: |
          set -o pipefail  # tee must not swallow the build exit code
          cd packages/flutter_weft
          dart analyze --fatal-infos 2>&1 | tee -a /tmp/flutter_build_output.log

      - name: Run Tests
        run: |
          set -o pipefail  # tee must not swallow the build exit code
          cd packages/flutter_weft
          flutter test -v 2>&1 | tee -a /tmp/flutter_build_output.log

      - name: Publish Dry Run
        run: |
          set -o pipefail  # tee must not swallow the build exit code
          cd packages/flutter_weft
          dart pub publish --dry-run 2>&1 | tee -a /tmp/flutter_build_output.log

      - name: Archive Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-weft-artifacts
          path: |
            packages/flutter_weft/libweft.so

      - name: Publish CI Result Branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci/flutter-status
          mkdir -p .ci-status
          echo "CONCLUSION=${{ job.status }}" > .ci-status/status.txt
          echo "SHA=${{ github.sha }}" >> .ci-status/status.txt
          echo "DATE=$(date -u)" >> .ci-status/status.txt
          if [ -f /tmp/flutter_build_output.log ]; then
            cp /tmp/flutter_build_output.log .ci-status/flutter_build_output.log
          fi
          git add -f .ci-status/
          git commit -m "ci: flutter status [${{ job.status }}] for ${{ github.sha }}" || true
          git push -f origin ci/flutter-status || true
