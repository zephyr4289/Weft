name: Nightly Deep Annihilation Matrix

# Weft Nightly Deep — runs the long, expensive, flakiness-exposing matrix
# that doesn't make sense on every push. Adapted from the founding
# extreme-test strategy's nightly job.
#
# Triggers:
#   - Nightly cron (00:00 UTC)
#   - Manual dispatch (workflow_dispatch)
#   - Push with [nightly] in commit message

on:
  schedule:
    - cron: '0 0 * * *'  # 00:00 UTC nightly
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'litmus/**'
      - 'bench/**'
      - '.github/workflows/nightly-deep.yml'

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: nightly-deep
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'
  RUST_TOOLCHAIN: 'stable'
  NODE_VERSION: '24'

jobs:

  # ===========================================================================
  # 1. LITMUS × 5 ITERATIONS — catch flaky EXPOSURE-SHORTFALLs
  # ===========================================================================
  litmus-stability:
    name: Litmus stability (5× iterations)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [c, rust, ts]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Rust
        if: matrix.lang == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        if: matrix.lang == 'rust'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/rust

      - name: Install Python deps
        run: pip install --quiet pyyaml

      - name: Build kernels
        run: make build-${{ matrix.lang == 'c' && 'c' || (matrix.lang == 'rust' && 'rust' || 'ts') }}

      - name: Run litmus × 5 iterations
        id: litmus_x5
        run: |
          set -o pipefail  # tee must not swallow the build exit code
          mkdir -p ci/run-artifacts
          chmod +x ci/scripts/run_litmus_stability.sh
          ./ci/scripts/run_litmus_stability.sh ${{ matrix.lang }} 5 2>&1 | tee ci/run-artifacts/shard-litmus-stability-${{ matrix.lang }}.log

      - name: Upload stability log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-litmus-stability-${{ matrix.lang }}
          path: ci/run-artifacts/shard-litmus-stability-${{ matrix.lang }}.log
          retention-days: 30

  # ===========================================================================
  # 2. LONG THERMAL — 10 min per backend × 4 backends (vs 2 min proxy on push)
  # ===========================================================================
  thermal-long:
    name: Thermal long (10min × 4 backends)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python deps
        run: pip install --quiet pyyaml psutil

      - name: Install gcc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc

      - name: Build C kernel (for W-suite backend C via ctypes)
        run: cd core/c && make

      - name: Run long thermal (600s per backend × 4 backends)
        run: |
          set -o pipefail  # tee must not swallow the build exit code
          mkdir -p ci/run-artifacts
          chmod +x ci/scripts/run_thermal_shard.sh
          ./ci/scripts/run_thermal_shard.sh 600 2>&1 | tee ci/run-artifacts/shard-thermal-long.log

      - name: Upload thermal-long log + JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-thermal-long
          path: |
            ci/run-artifacts/shard-thermal-long.log
            bench/results/wsuite-thermal-x86_64-sandbox.json
          retention-days: 30

  # ===========================================================================
  # 3. TSAN RE-RUN — C kernel with -fsanitize=thread, all 8 litmus tests
  # ===========================================================================
  tsan-deep:
    name: TSAN deep (C kernel, 5×8 = 40 runs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps + clang
        run: |
          pip install --quiet pyyaml
          sudo apt-get update -qq && sudo apt-get install -y -qq clang

      - name: Build C kernel with TSAN
        run: |
          cd core/c
          gcc -O1 -g -fsanitize=thread -std=c11 -Wall -Wextra -pthread -D_GNU_SOURCE \
            -o spike-tsan weft.c litmus_runner.c

      - name: Run TSAN litmus × 5 iterations
        run: |
          set -o pipefail  # tee must not swallow the build exit code
          mkdir -p ci/run-artifacts
          chmod +x ci/scripts/run_tsan_deep.sh
          ./ci/scripts/run_tsan_deep.sh 5 2>&1 | tee ci/run-artifacts/shard-tsan-deep.log

      - name: Upload TSAN log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-tsan-deep
          path: ci/run-artifacts/shard-tsan-deep.log
          retention-days: 30

  # ===========================================================================
  # 4. FULL CLEAN-TREE VALIDATION — unpack tarball + run all 5 make targets
  #    (the same protocol as R3 in WO-P5-VERIFICATION)
  # ===========================================================================
  clean-tree-deep:
    name: Clean-tree validation (tarball unpack + 5 targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Binding parity guard (all mirror pairs)
        run: bash ci/scripts/run_binding_parity.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python deps + tectonic + pandoc
        run: |
          pip install --quiet pyyaml pymupdf psutil
          curl -sSL https://drop-sh.fullyjustified.net | sh
          sudo mv tectonic /usr/local/bin/
          sudo apt-get update -qq && sudo apt-get install -y -qq pandoc

      - name: Build tarball from current commit
        run: |
          # Build the release tarball from the current source tree
          mkdir -p /tmp/tarball-build
          cp -r . /tmp/tarball-build/weft
          cd /tmp/tarball-build
          tar -czf weft-nightly.tar.gz weft
          mv weft-nightly.tar.gz "$GITHUB_WORKSPACE/"

      - name: Run clean-tree validation
        run: |
          set -o pipefail  # tee must not swallow the build exit code
          mkdir -p ci/run-artifacts
          chmod +x ci/scripts/run_clean_tree_deep.sh
          ./ci/scripts/run_clean_tree_deep.sh weft-nightly.tar.gz 2>&1 | tee ci/run-artifacts/shard-clean-tree.log

      - name: Upload clean-tree logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-clean-tree-deep
          path: |
            ci/run-artifacts/shard-clean-tree.log
            litmus/evidence/clean-tree-nightly/
          retention-days: 30

  # ===========================================================================
  # 5. AGGREGATE — push to ci-report branch with nightly- prefix
  # ===========================================================================
  aggregate-nightly:
    name: Aggregate nightly → ci-report
    runs-on: ubuntu-latest
    needs: [litmus-stability, thermal-long, tsan-deep, clean-tree-deep]
    if: always()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download all nightly artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: log-*
          path: ci/downloaded-logs
          merge-multiple: true

      - name: Aggregate nightly
        run: |
          python3 ci/scripts/aggregate_reports.py \
            --logs-dir ci/downloaded-logs \
            --results-dir ci/downloaded-logs \
            --run-number ${{ github.run_number }} \
            --commit-sha ${{ github.sha }} \
            --out-dir ci/final-report \
            --nightly || true

      - name: Push to ci-report branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --heads origin ci-report | grep -q ci-report; then
            git fetch origin ci-report
            git checkout ci-report
            git pull --rebase origin ci-report || true
          else
            git checkout --orphan ci-report
            git rm -rf . || true
            echo "# Weft CI Reports" > README.md
            git add README.md
            git commit -m "chore(ci): initialize ci-report branch" || true
          fi

          RUN_DIR="runs/nightly-$(date -u +%Y-%m-%d)-$(printf '%05d' ${{ github.run_number }})"
          mkdir -p "$RUN_DIR/shards"

          cp ci/final-report/combined.log "$RUN_DIR/combined.log"
          cp ci/final-report/summary.json "$RUN_DIR/summary.json"
          cp ci/downloaded-logs/shard-*.log "$RUN_DIR/shards/" 2>/dev/null || true

          # Update nightly-latest symlinks (file copies; git doesn't track symlinks well across OSes)
          cp "$RUN_DIR/combined.log" nightly-latest.log
          cp "$RUN_DIR/summary.json" nightly-latest-summary.json

          git add "$RUN_DIR" nightly-latest.log nightly-latest-summary.json
          git commit -m "test(ci-nightly): ${{ github.run_number }} [skip ci]" || true
          git push origin ci-report || true
