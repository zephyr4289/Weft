name: Nightly Deep Annihilation Matrix

# Weft Nightly Deep — runs the long, expensive, flakiness-exposing matrix
# that doesn't make sense on every push. Adapted from the founding
# extreme-test strategy's nightly job.
#
# Triggers:
#   - Nightly cron (00:00 UTC)
#   - Manual dispatch (workflow_dispatch)
#   - Push with [nightly] in commit message
#
# NOTE: this workflow previously ALSO fired on every push touching
# core/litmus/bench — racing the full extreme-test matrix on the same SHA
# and double-paying the most expensive jobs we have (10-min thermal, TSAN,
# chaos-10M, Loom bound-3, TLC). The documented intent was always the
# [nightly] commit-message marker; the trigger now matches the docs. The
# cron leg still covers main's HEAD every night, so nothing is lost —
# the duplicate same-SHA runs are.

on:
  schedule:
    - cron: '0 0 * * *'  # 00:00 UTC nightly
  workflow_dispatch:
  push:
    branches: [main]

# Marker gate used by every job below: scheduled/dispatched runs always go;
# push runs only when the head commit asks for it with [nightly].

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: nightly-deep
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'
  RUST_TOOLCHAIN: 'stable'
  NODE_VERSION: '24'

jobs:

  # ===========================================================================
  # 1. LITMUS × 5 ITERATIONS — catch flaky EXPOSURE-SHORTFALLs
  # ===========================================================================
  litmus-stability:
    name: Litmus stability (5× iterations)
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[nightly]')
    strategy:
      fail-fast: false
      matrix:
        lang: [c, rust, ts]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Rust
        if: matrix.lang == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        if: matrix.lang == 'rust'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/rust

      - name: Install Python deps
        run: pip install --quiet pyyaml

      - name: Build kernels
        run: make build-${{ matrix.lang == 'c' && 'c' || (matrix.lang == 'rust' && 'rust' || 'ts') }}

      - name: Run litmus × 5 iterations
        id: litmus_x5
        run: |
          set -o pipefail  # tee must not swallow the build exit code
          mkdir -p ci/run-artifacts
          chmod +x ci/scripts/run_litmus_stability.sh
          ./ci/scripts/run_litmus_stability.sh ${{ matrix.lang }} 5 2>&1 | tee ci/run-artifacts/shard-litmus-stability-${{ matrix.lang }}.log

      - name: Upload stability artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-litmus-stability-${{ matrix.lang }}
          path: |
            ci/run-artifacts/shard-litmus-stability-${{ matrix.lang }}.log
            ci/run-artifacts/shard-litmus-stability-${{ matrix.lang }}-results.json
          retention-days: 30

  # ===========================================================================
  # 2. LONG THERMAL — 10 min per backend × 4 backends (vs 2 min proxy on push)
  # ===========================================================================
  thermal-long:
    name: Thermal long (10min × 4 backends)
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[nightly]')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python deps
        run: pip install --quiet pyyaml psutil

      - name: Install gcc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc

      - name: Build C kernel (for W-suite backend C via ctypes)
        run: cd core/c && make

      - name: Run long thermal (600s per backend × 4 backends)
        run: |
          set -o pipefail  # tee must not swallow the build exit code
          mkdir -p ci/run-artifacts
          chmod +x ci/scripts/run_thermal_shard.sh
          ./ci/scripts/run_thermal_shard.sh 600 2>&1 | tee ci/run-artifacts/shard-thermal-long.log

      - name: Upload thermal-long artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-thermal-long
          path: |
            ci/run-artifacts/shard-thermal-long.log
            ci/run-artifacts/shard-thermal-long-results.json
            ci/run-artifacts/shard-thermal-proxy-results.json
            bench/results/wsuite-thermal-x86_64-sandbox.json
          if-no-files-found: ignore
          retention-days: 30

  # ===========================================================================
  # 3. TSAN RE-RUN — C kernel with -fsanitize=thread, all 8 litmus tests
  # ===========================================================================
  tsan-deep:
    name: TSAN deep (C kernel, 5×8 = 40 runs)
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[nightly]')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps + clang
        run: |
          pip install --quiet pyyaml
          sudo apt-get update -qq && sudo apt-get install -y -qq clang

      - name: Build C kernel with TSAN
        run: |
          make -C core/c spike-tsan

      - name: Run TSAN litmus × 5 iterations
        run: |
          set -o pipefail  # tee must not swallow the build exit code
          mkdir -p ci/run-artifacts
          chmod +x ci/scripts/run_tsan_deep.sh
          ./ci/scripts/run_tsan_deep.sh 5 2>&1 | tee ci/run-artifacts/shard-tsan-deep.log

      - name: Upload TSAN artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-tsan-deep
          path: |
            ci/run-artifacts/shard-tsan-deep.log
            ci/run-artifacts/shard-tsan-deep-results.json
          retention-days: 30

  # ===========================================================================
  # 4. FULL CLEAN-TREE VALIDATION — unpack tarball + run all 5 make targets
  #    (the same protocol as R3 in WO-P5-VERIFICATION)
  # ===========================================================================
  clean-tree-deep:
    name: Clean-tree validation (tarball unpack + 5 targets)
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[nightly]')
    steps:
      - uses: actions/checkout@v4

      - name: Binding parity guard (all mirror pairs)
        run: bash ci/scripts/run_binding_parity.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python deps + tectonic + pandoc
        run: |
          set -o pipefail  # no silent-green: a failed curl must fail the step
          pip install --quiet pyyaml pymupdf psutil
          curl -sSL https://drop-sh.fullyjustified.net | sh
          sudo mv tectonic /usr/local/bin/
          sudo apt-get update -qq && sudo apt-get install -y -qq pandoc

      - name: Build tarball from current commit
        run: |
          # Build the release tarball from the current source tree
          mkdir -p /tmp/tarball-build
          cp -r . /tmp/tarball-build/weft
          cd /tmp/tarball-build
          tar -czf weft-nightly.tar.gz weft
          mv weft-nightly.tar.gz "$GITHUB_WORKSPACE/"

      - name: Run clean-tree validation
        run: |
          set -o pipefail  # tee must not swallow the build exit code
          mkdir -p ci/run-artifacts
          chmod +x ci/scripts/run_clean_tree_deep.sh
          ./ci/scripts/run_clean_tree_deep.sh weft-nightly.tar.gz 2>&1 | tee ci/run-artifacts/shard-clean-tree.log

      - name: Upload clean-tree artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-clean-tree-deep
          path: |
            ci/run-artifacts/shard-clean-tree.log
            ci/run-artifacts/shard-clean-tree-results.json
            litmus/evidence/clean-tree-nightly/
          if-no-files-found: ignore
          retention-days: 30

  # ===========================================================================
  # 4b. LANGUAGE MATRIX — every VM port's FULL battery, nightly, on the
  # runner that owns its toolchain (the "runs everywhere, proven" mandate).
  #   kotlin: android gradle test (VarHandle ring + FanoutCompat matrix,
  #           F-series incl. two F10 100k tortures)
  #   swift:  swift test on macOS (F-series F1-F10 + Cadence + Metal probe)
  #   dart:   flutter test over the compiled C kernel (F-series + DF-series
  #           FFI + DC-series cross-isolate + F10-Dart)
  # ===========================================================================
  lang-ports:
    name: Language battery — ${{ matrix.lang }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[nightly]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - lang: kotlin
            os: ubuntu-latest
          - lang: swift
            os: macos-14
          - lang: dart
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        if: matrix.lang == 'kotlin'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle (build caching)
        if: matrix.lang == 'kotlin'
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses & Install NDK / CMake
        if: matrix.lang == 'kotlin'
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare Gradle Wrapper
        if: matrix.lang == 'kotlin'
        run: chmod +x android/gradlew

      - name: Select Xcode
        if: matrix.lang == 'swift'
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || true

      - name: Setup Flutter SDK
        if: matrix.lang == 'dart'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Battery — kotlin (JVM + compat matrix)
        if: matrix.lang == 'kotlin'
        run: |
          set -o pipefail  # no silent-green
          cd android
          ./gradlew test --stacktrace 2>&1 | tee /tmp/lang-kotlin.log

      - name: Battery — swift (SPM, Metal probe included)
        if: matrix.lang == 'swift'
        run: |
          set -o pipefail
          swift build 2>&1 | tee /tmp/lang-swift.log
          swift test 2>&1 | tee -a /tmp/lang-swift.log

      - name: Battery — dart (FFI over the compiled C kernel)
        if: matrix.lang == 'dart'
        run: |
          set -o pipefail
          mkdir -p packages/flutter_weft/build
          gcc -shared -fPIC -O3 -Icore/c core/c/weft.c core/c/fanout.c core/c/frame_cursor.c core/c/fanout_simd.c \
            -o packages/flutter_weft/libweft.so
          cp packages/flutter_weft/libweft.so /tmp/libweft.so
          cd packages/flutter_weft
          flutter pub get 2>&1 | tee /tmp/lang-dart.log
          dart analyze --fatal-infos 2>&1 | tee -a /tmp/lang-dart.log
          flutter test 2>&1 | tee -a /tmp/lang-dart.log

      - name: Archive language battery log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-lang-${{ matrix.lang }}
          path: /tmp/lang-*.log
          retention-days: 30

  # ===========================================================================
  # 5. AGGREGATE — push to ci-report branch with nightly- prefix
  # ===========================================================================
  aggregate-nightly:
    name: Aggregate nightly → ci-report
    runs-on: ubuntu-latest
    needs: [litmus-stability, thermal-long, tsan-deep, clean-tree-deep, lang-ports]
    if: always() && (github.event_name != 'push' || contains(github.event.head_commit.message, '[nightly]'))
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download all nightly artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: log-*
          path: ci/downloaded-logs
          merge-multiple: true

      - name: Aggregate nightly
        run: |
          python3 ci/scripts/aggregate_reports.py \
            --logs-dir ci/downloaded-logs \
            --results-dir ci/downloaded-logs \
            --run-number ${{ github.run_number }} \
            --commit-sha ${{ github.sha }} \
            --out-dir ci/final-report \
            --nightly || true

      - name: Push to ci-report branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail  # no silent-green in the ci-report bookkeeping
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # grep -q rc=1 = branch absent — the intended fallthrough, made explicit
          BRANCH_EXISTS=$(git ls-remote --heads origin ci-report | grep -c ci-report || true)
          if [ "${BRANCH_EXISTS:-0}" != "0" ]; then
            git fetch origin ci-report
            git checkout ci-report
            git pull --rebase origin ci-report || true
          else
            git checkout --orphan ci-report
            git rm -rf . || true
            echo "# Weft CI Reports" > README.md
            git add README.md
            git commit -m "chore(ci): initialize ci-report branch" || true
          fi

          RUN_DIR="runs/nightly-$(date -u +%Y-%m-%d)-$(printf '%05d' ${{ github.run_number }})"
          mkdir -p "$RUN_DIR/shards"

          cp ci/final-report/combined.log "$RUN_DIR/combined.log"
          cp ci/final-report/summary.json "$RUN_DIR/summary.json"
          cp ci/downloaded-logs/shard-*.log "$RUN_DIR/shards/" 2>/dev/null || true

          # Update nightly-latest symlinks (file copies; git doesn't track symlinks well across OSes)
          cp "$RUN_DIR/combined.log" nightly-latest.log
          cp "$RUN_DIR/summary.json" nightly-latest-summary.json

          git add "$RUN_DIR" nightly-latest.log nightly-latest-summary.json
          git commit -m "test(ci-nightly): ${{ github.run_number }} [skip ci]" || true
          git push origin ci-report || true

  # ===========================================================================
  # RFC 0011 — the 10,000,000-frame chaos tier + bound-3 loom sweep + TLC
  # ===========================================================================
  chaos-10m:
    name: Chaos free-running (10,000,000 frames, seed-deterministic faults)
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[nightly]')
    steps:
      - uses: actions/checkout@v4
      - name: Build the chaos engine
        run: |
          set -euo pipefail
          make -C core/c fanout-chaos fanout-chaos-seq
      - name: Chaos 10M — fenced acq/rel regime
        run: |
          set -euo pipefail
          mkdir -p ci/run-artifacts
          ./core/c/fanout-chaos free 10000000 4 16 3 30 31415926 | tee ci/run-artifacts/chaos-10m-fenced.json
      - name: Chaos 10M — all-seq_cst regime
        run: |
          set -euo pipefail
          ./core/c/fanout-chaos-seq free 10000000 4 16 3 30 31415926 | tee ci/run-artifacts/chaos-10m-seqcst.json
      - name: Chaos 10M — 8-slot wide ring, 4 readers
        run: |
          set -euo pipefail
          ./core/c/fanout-chaos free 10000000 8 8 4 30 271828 | tee ci/run-artifacts/chaos-10m-wide.json
      - name: Upload chaos-10m artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-chaos-10m
          path: ci/run-artifacts/

  loom-bound3:
    name: Loom preemption-bound-3 exhaustive sweep (RFC 0011 deep-model)
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[nightly]')
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            core/rust/target
          key: loom-bound3-${{ runner.os }}-${{ hashFiles('core/rust/Cargo.lock') }}
      - name: Run the ignored bound-3 model (minutes by design)
        run: |
          set -euo pipefail
          mkdir -p ci/run-artifacts
          cd core/rust
          cargo test --release --test loom_fanout -- --ignored --nocapture 2>&1 | tee ../../ci/run-artifacts/loom-bound3.log
      - name: Upload loom evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-loom-bound3
          path: ci/run-artifacts/

  formal-deep:
    name: TLA+ deeper bounds (3 readers / 4 frames)
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[nightly]')
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache pinned TLC jar
        uses: actions/cache@v4
        with:
          path: .tlc-cache/tla2tools-1.8.0.jar
          key: tla2tools-1.8.0-9d36716f
      - name: Fetch pinned TLC
        run: |
          set -euo pipefail
          mkdir -p .tlc-cache ci/run-artifacts
          if [ -f .tlc-cache/tla2tools-1.8.0.jar ]; then
            echo "TLC jar restored from cache — verifying pinned sha256"
          else
            curl -sSLf -o .tlc-cache/tla2tools-1.8.0.jar https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          fi
          ACTUAL_SHA="$(sha256sum .tlc-cache/tla2tools-1.8.0.jar | cut -d' ' -f1)"
          if [ "$ACTUAL_SHA" != "9d36716ffb5e49d1ba8fae4651eba59f3189887e12eb90e204a42d2e6e993fef" ] && [ "$ACTUAL_SHA" != "9732eea90bdc7432e618184e4bee78700460e83e988238a80151dfd6507cfa0c" ]; then
            echo "tla2tools sha256 mismatch: got $ACTUAL_SHA"
            exit 1
          fi
          echo "tla2tools 1.8.0 sha256 OK ($ACTUAL_SHA)"
      - name: FanoutSeqlock — wider model (3 readers, 4 frames)
        run: |
          set -euo pipefail
          cd formal/fanout
          sed -e 's/READERS = 2/READERS = 3/' -e 's/FRAMES = 3/FRAMES = 4/' FanoutSeqlock.cfg > FanoutSeqlock-nightly.cfg
          java -XX:+UseParallelGC -Xmx4g -cp ../../.tlc-cache/tla2tools-1.8.0.jar tlc2.TLC -config FanoutSeqlock-nightly.cfg FanoutSeqlock.tla 2>&1 | tee ../../ci/run-artifacts/formal-nightly-fanout.log
          grep -q "Model checking completed. No error has been found." ../../ci/run-artifacts/formal-nightly-fanout.log
      - name: ReattachPolicy — deeper model (3 deaths, 4 frames)
        run: |
          set -euo pipefail
          cd formal/reattach
          sed -e 's/DEATHS = 2/DEATHS = 3/' -e 's/FRAMES = 3/FRAMES = 4/' ReattachPolicy.cfg > ReattachPolicy-nightly.cfg
          java -XX:+UseParallelGC -Xmx4g -cp ../../.tlc-cache/tla2tools-1.8.0.jar tlc2.TLC -config ReattachPolicy-nightly.cfg ReattachPolicy.tla 2>&1 | tee ../../ci/run-artifacts/formal-nightly-reattach.log
          grep -q "Model checking completed. No error has been found." ../../ci/run-artifacts/formal-nightly-reattach.log
      - name: Upload formal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-formal-deep
          path: ci/run-artifacts/
