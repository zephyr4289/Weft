name: npm Packages CI

# Path-aware: this workflow only owns the JS/TS package surface. A change
# outside it (kernel C, docs, reports, ...) cannot alter its outcome, so it
# stays asleep. Ownership contract: ci/README.md.
on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/**'
      - 'core/ts/**'
      - 'fixtures/**'
      - 'heddles/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'ci/scripts/run_binding_parity.sh'
      - '.github/workflows/npm-packages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'
      - 'core/ts/**'
      - 'fixtures/**'
      - 'heddles/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'ci/scripts/run_binding_parity.sh'
      - '.github/workflows/npm-packages.yml'
  workflow_dispatch:

concurrency:
  group: npm-packages-${{ github.ref }}
  # PRs: newest head wins; pushes to a branch: let it finish
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  build-and-test:
    name: Node ${{ matrix.node-version }} Matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize Log
        run: |
          set -o pipefail
          mkdir -p "${RUNNER_TEMP:-/tmp}"
          echo "=== Starting npm Packages CI (Node ${{ matrix.node-version }}) ===" > "${RUNNER_TEMP:-/tmp}/npm_build_output.log"

      - name: Binding parity guard (core/ts <-> packages/core)
        run: |
          set -o pipefail
          bash ci/scripts/run_binding_parity.sh 2>&1 | tee -a "${RUNNER_TEMP:-/tmp}/npm_build_output.log"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          set -o pipefail
          pnpm install 2>&1 | tee -a "${RUNNER_TEMP:-/tmp}/npm_build_output.log"

      - name: Build all packages
        run: |
          set -o pipefail
          pnpm -r build 2>&1 | tee -a "${RUNNER_TEMP:-/tmp}/npm_build_output.log"

      - name: Unit tests (package suites)
        run: |
          set -o pipefail
          pnpm -r --filter "./packages/*" test 2>&1 | tee -a "${RUNNER_TEMP:-/tmp}/npm_build_output.log"

      - name: Check API drift
        run: |
          set -o pipefail
          pnpm exec api-extractor run --local --config packages/core/api-extractor.json 2>&1 | tee -a "${RUNNER_TEMP:-/tmp}/npm_build_output.log"
          pnpm exec api-extractor run --local --config packages/react/api-extractor.json 2>&1 | tee -a "${RUNNER_TEMP:-/tmp}/npm_build_output.log"
          pnpm exec api-extractor run --local --config packages/vue/api-extractor.json 2>&1 | tee -a "${RUNNER_TEMP:-/tmp}/npm_build_output.log"
          pnpm exec api-extractor run --local --config packages/svelte/api-extractor.json 2>&1 | tee -a "${RUNNER_TEMP:-/tmp}/npm_build_output.log"
          pnpm exec api-extractor run --local --config packages/react-native/api-extractor.json 2>&1 | tee -a "${RUNNER_TEMP:-/tmp}/npm_build_output.log"
          git diff --exit-code packages/*/etc/*.api.md 2>&1 | tee -a "${RUNNER_TEMP:-/tmp}/npm_build_output.log"

      - name: Test Packaged Litmus
        run: |
          set -o pipefail
          pnpm --filter fixture-node-litmus build 2>&1 | tee -a "${RUNNER_TEMP:-/tmp}/npm_build_output.log"
          node fixtures/node-litmus/dist/litmus-packaged.js L8-envelope 2>&1 | tee -a "${RUNNER_TEMP:-/tmp}/npm_build_output.log"
          node fixtures/node-litmus/dist/litmus-packaged.js L7-revocation 2>&1 | tee -a "${RUNNER_TEMP:-/tmp}/npm_build_output.log"
          node fixtures/node-litmus/dist/litmus-packaged.js L6-ownership 2>&1 | tee -a "${RUNNER_TEMP:-/tmp}/npm_build_output.log"

      - name: Build Vite React fixture
        run: |
          set -o pipefail
          pnpm --filter fixture-vite-react build 2>&1 | tee -a "${RUNNER_TEMP:-/tmp}/npm_build_output.log"

      - name: Dry-run publish
        run: |
          set -o pipefail
          pnpm -r --filter "./packages/*" publish --dry-run --no-git-checks 2>&1 | tee -a "${RUNNER_TEMP:-/tmp}/npm_build_output.log"

      - name: Archive Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-node-${{ matrix.node-version }}-logs
          path: |
            ${{ runner.temp }}/npm_build_output.log
            /tmp/npm_build_output.log

      - name: Publish logs → ci/logs branch
        if: always()
        run: |
          set -o pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          SHA="${{ github.sha }}"
          EVENT="${{ github.event_name }}"
          STATUS="${{ job.status }}"
          NODE_VER="${{ matrix.node-version }}"
          LOG_DIR="npm/node-${NODE_VER}/${SHA}"

          WORK=$(mktemp -d)
          cp -r .git "$WORK/.git"
          cd "$WORK"

          git fetch origin ci/logs 2>/dev/null && git checkout ci/logs || {
            git checkout --orphan ci/logs
            git rm -rf . 2>/dev/null || true
            git commit --allow-empty -m "chore(ci): init ci/logs branch" || true
          }

          mkdir -p "$LOG_DIR"

          {
            echo "workflow: npm-packages"
            echo "job:      Node ${NODE_VER} Matrix"
            echo "node:     ${NODE_VER}"
            echo "status:   $STATUS"
            echo "sha:      $SHA"
            echo "event:    $EVENT"
            echo "run:      ${{ github.run_number }}"
            echo "date:     $(date -u)"
            echo "ref:      ${{ github.ref }}"
          } > "$LOG_DIR/status.txt"

          LOG_FILE="${RUNNER_TEMP:-/tmp}/npm_build_output.log"
          if [ -f "$LOG_FILE" ]; then
            cp "$LOG_FILE" "$LOG_DIR/build.log"
          elif [ -f "/tmp/npm_build_output.log" ]; then
            cp "/tmp/npm_build_output.log" "$LOG_DIR/build.log"
          else
            echo "(no build log collected)" > "$LOG_DIR/build.log"
          fi

          git add -f "$LOG_DIR/"
          git commit -m "ci(npm-node-${NODE_VER}): $STATUS [${SHA:0:8}] event=$EVENT run=${{ github.run_number }}" || true
          # ci/logs sees concurrent pushes from sibling matrix jobs — retry
          # with rebase so a log is never silently dropped to a lost race.
          PUSHED=0
          for attempt in 1 2 3; do
            if git push origin ci/logs; then PUSHED=1; break; fi
            git pull --rebase origin ci/logs || true
            sleep $((attempt * 2))
          done
          if [ "$PUSHED" != "1" ]; then
            echo "::warning::ci/logs push lost the race 3x — log for $LOG_DIR not published"
          fi
