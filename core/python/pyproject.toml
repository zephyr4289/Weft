[build-system]
requires = ["setuptools>=61.0", "cffi>=1.15", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weft"
version = "0.1.0"
description = "Python bindings for the Weft lock-free streaming ring (C core: Triad kernel + RFC-0004 fan-out)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Weft Contributors" }]
keywords = ["lock-free", "ring-buffer", "streaming", "realtime", "shared-memory", "numpy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: System :: Distributed Computing",
]
dependencies = ["cffi>=1.15"]

[project.optional-dependencies]
numpy = ["numpy>=1.22"]
test = ["numpy>=1.22"]

[tool.setuptools]
packages = ["weft"]
py-modules = ["build"]

[tool.setuptools.package-data]
weft = ["py.typed"]
