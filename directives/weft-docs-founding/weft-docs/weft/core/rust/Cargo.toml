[package]
name = "weft-core"
version = "0.1.0"
edition = "2021"
description = "Off-heap, zero-copy, draw-phase-read channel for declarative UI. Triad Protocol kernel + litmus runner."
license = "Apache-2.0"

# Per 06-PITFALLS §3: zero crates, non-negotiable. Build with --offline.
# The kernel has no `[dependencies]` section by design.

[lib]
name = "weft_core"
path = "src/lib.rs"

[[bin]]
name = "litmus"
path = "src/bin/litmus.rs"

[profile.release]
opt-level = 3
panic = "abort"
codegen-units = 1
lto = "fat"
strip = "symbols"

[profile.dev]
opt-level = 1

[dev-dependencies]
loom = "0.7.2"
