\* seqlock_ring.cfg — Weft Pillar 8, TLC model configuration (CI tier).
\* Smallest shape that contains a full tear-window interleaving AND a full
\* ring wrap: 2 readers, 2 slots, 2 payload values, sequence cap 4.
\* (The >= 10^7 distinct-state exploration tier is seqlock_ring_full.cfg.)
CONSTANTS
    READERS = 2
    SLOTS = 2
    VALUES = 2
    SEQCAP = 4

SPECIFICATION Spec
INVARIANT Inv
PROPERTY ReaderNeverBlocksWriter
CHECK_DEADLOCK TRUE
