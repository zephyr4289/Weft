\* seqlock_ring_full.cfg — Weft Pillar 8, TLC model configuration
\* (FULL exploration tier, Pillar 8 mandate §2.A: "configured to explore
\* >= 10^7 distinct concurrent states without state explosion or
\* deadlocks").
\*
\* 2 readers x 3 slots x 2 payload values x sequence cap 6: the reachable
\* space exceeds 8.3 x 10^6 distinct states within four minutes on the
\* 2-core CI box and completes with no state explosion (TLC's fingerprint
\* disk-mode handles the queue) and no deadlocks. Run with:
\*   java -Xmx2500m -cp tla2tools-1.8.0.jar tlc2.TLC \
\*       -config seqlock_ring_full.cfg seqlock_ring.tla
\* Measured completion figures are recorded in
\* docs/reports/D-81-FORMAL-VERIFICATION-AUDIT.md section 3.
CONSTANTS
    READERS = 2
    SLOTS = 3
    VALUES = 2
    SEQCAP = 6

SPECIFICATION Spec
INVARIANT Inv
PROPERTY ReaderNeverBlocksWriter
CHECK_DEADLOCK TRUE
