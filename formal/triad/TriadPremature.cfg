\* FreeMode = 2 (premature free): EXPECTED COUNTEREXAMPLE — the UAF trace.
\* NoUseAfterFree must be violated — the trace is the proof that the I6
\* handshake (free only after the epoch ACK) is load-bearing: without it the
\* releaser's poison/free lands while the writer is mid-frame (or before its
\* advisory revoked-load has caught up, so a NEW frame begins on freed
\* memory) — exactly the A1 bug the handshake prevents. AckBeforeFree is
\* violated by construction in this mode (free never waits for the ACK) and
\* is checked in the after-ack regime instead.
\* The shard driver greps for the violation; a CLEAN run here is a RED shard.
CONSTANTS
    FRAMES = 3
    WORDS = 2
    Regime = 1
    FreeMode = 2

SPECIFICATION Spec
INVARIANT TypeOK
         HistConsistent
         OwnershipPartition
         CanaryIntegrity
         TornPayload
         ObservedMonotone
         NoUseAfterFree
CHECK_DEADLOCK TRUE
