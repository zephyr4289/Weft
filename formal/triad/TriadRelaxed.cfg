\* Regime = 2 (relaxed exchange ordering): EXPECTED COUNTEREXAMPLE.
\* One of CanaryIntegrity / TornPayload / ObservedMonotone must be violated —
\* the trace is the necessity proof (weaker than acq_rel breaks the kernel).
\* The shard driver greps for the violation; a CLEAN run here is a RED shard.
CONSTANTS
    FRAMES = 3
    WORDS = 2
    Regime = 2
    FreeMode = 1

SPECIFICATION Spec
INVARIANT TypeOK
         HistConsistent
         OwnershipPartition
         CanaryIntegrity
         TornPayload
         ObservedMonotone
         NoUseAfterFree
         AckBeforeFree
CHECK_DEADLOCK TRUE
