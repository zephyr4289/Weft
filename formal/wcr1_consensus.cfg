\* wcr1_consensus.cfg — Weft Pillar 8, TLC model configuration (CI tier).
\* 3 nodes (smallest quorum-bearing cluster), epoch cap 2, lease 2 ticks,
\* bounded message buffer 2 — the smallest shape containing a split, a
\* heal, an election through a minority component, a stale-epoch heartbeat
\* refusal, and TWO successive primaries (the quorum-intersection
\* mechanism is fully exercised: winning epoch e requires a majority that
\* promised e, and a second e-primary needs a disjoint e-majority).
\* (The exploration tier for larger shapes is wcr1_consensus_full.cfg.)
CONSTANTS
    NN = 3
    EPOCHCAP = 2
    LEASEMAX = 2
    MSGBUF = 2

SPECIFICATION Spec
INVARIANT Inv
CHECK_DEADLOCK TRUE
