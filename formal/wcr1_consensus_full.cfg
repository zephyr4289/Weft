\* wcr1_consensus_full.cfg — Weft Pillar 8, TLC model configuration
\* (FULL exploration tier): epoch cap 3 and message buffer 3 scale the
\* bounded model well past the CI shape (which already explores 8,035,488
\* distinct states exhaustively). Run on a larger workstation with:
\*   java -Xmx4g -cp tla2tools-1.8.0.jar tlc2.TLC \
\*       -config wcr1_consensus_full.cfg wcr1_consensus.tla
\* The CI tier (wcr1_consensus.cfg) is the exhaustive-completion gate;
\* this tier is the scaled exploration tier. Both check the identical
\* invariant set.
CONSTANTS
    NN = 3
    EPOCHCAP = 3
    LEASEMAX = 2
    MSGBUF = 3

SPECIFICATION Spec
INVARIANT Inv
CHECK_DEADLOCK TRUE
