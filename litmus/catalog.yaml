# Weft Phase 0 Litmus Catalog — canonical test specification
# Per 05-CONTRACTS §3. The catalog is the machine-readable specification of the suite.
# Runners in C, Rust, and TypeScript all parse this same catalog and execute it.

catalog: weft-litmus
version: 2   # v2 (WO-P0A A9, 2026-09-11): L1 gains per-language min_claims map

defaults:
  payload_max: 256
  seed: 0x00C0FFEE   # default xorshift32 seed (04-LITMUS §0.2)

# Memory-ordering matrix copied verbatim from 02-KERNEL §5.
# The three kernels must cite it; they do NOT restate it inline.
ordering_matrix:
  latest:
    op: exchange_writer_and_reader
    ordering: acq_rel
    note: "single RMW ownership transfer; publishes payload writes to reader (Release) and acquires the returned buffer's final state (Acquire)"
  revoked:
    writer_load: relaxed
    releaser_store: release
    note: "advisory check only; correctness via ACK chain; pairs with epoch.fetch_add(AcqRel) → reclaim.poll(Acquire)"
  epoch:
    writer_ack: fetch_add_acqrel
    reclaim_poll: acquire
    note: "the ACK; publishes 'I will never write again'; licenses poison/free"
  telemetry:
    op: fetch_add
    ordering: relaxed
    note: "statistics; never synchronization"
  t_publish_reads:
    op: load
    ordering: acquire
    note: "L4 freshness protocol; claim's Acquire edge synchronizes with writer's Release-half"

tests:
  - id: L1-tear
    adversary: "reader hold 5/10/50 ms between swap and read; writer 2x display rate"
    verdict: "torn == 0 across all holds AND drain_ok AND claims >= min_claims"
    params:
      holds_ms: [5, 10, 50]
      writer_hz: 240
      frames: 600
      payload_max: 1024
      min_claims: { c: 600, rust: 600, ts: 200 }   # exposure floor, per-language, catalog-owned (WO-P0A A4)

  - id: L2-writer-steps
    adversary: "instrumented publish while reader held for swept durations 0/10/25/50/100 ms"
    verdict: "max_wsteps <= bound AND publishes == 2000 in every config"
    params:
      holds_ms: [0, 10, 25, 50, 100]
      publishes: 2000
      writer_hz: 2000
      payload_max: 256
      bound: 2

  - id: L3-reader-steps
    adversary: "writer storm at 4x; claims=2000 on reader"
    verdict: "max_rsteps <= bound AND claims == 2000 AND zero claim failures"
    params:
      writer_hz: 960
      claims: 2000
      payload_max: 256
      bound: 2

  - id: L4-freshness
    adversary: "writer at 4x reader rate"
    verdict: "freshness_violations == 0 AND future_violations == 0 AND drain_exact"
    params:
      writer_hz: 960
      reader_hz: 240
      frames: 2000
      payload_max: 256

  - id: L5-progress
    adversary: "reader held 0/10/50/100 ms; plus a config where the reader is suspended entirely"
    verdict: "max(rate)/min(rate) <= tolerance across all five configs"
    params:
      holds_ms: [0, 10, 50, 100]
      window_s: 1.0
      writer_hz: 2000
      payload_max: 256
      tolerance: 1.5
      # The fifth config (reader suspended entirely) is implicit: holds_ms value of -1 = suspended.
      # The runner interprets -1 as "do not spawn a reader thread."

  - id: L6-ownership
    adversary: "randomized writer/reader delays (xorshift32, catalog seed), 200 trials"
    verdict: "violations == 0 across all trials, all languages, same seed → identical schedule"
    params:
      trials: 200
      frames: 64
      max_delay_us: 500
      payload_max: 256
      seed: 0x00C0FFEE

  - id: L7-revocation
    adversary: "release() while a native writer spins uncapped"
    verdict: "reclaim_ok AND post_revoke_revoked == 100 AND poison_intact"
    params:
      timeout_ms: 2000
      payload_max: 256

  - id: L8-envelope
    adversary: "none — pure functions + one live Weft, no threads, <1s"
    verdict: "all four subchecks true (roundtrip, unknown_fields, negotiation, coexist)"
    params: {}
