name: weft_flutter_tensor
description: >-
  Real-time AI tensor widgets over WTR1 (Weft Tensor Ring v1) shared-memory
  rings via dart:ffi — zero-GC AI overlay rendering (boxes / skeletons) for
  Flutter at display refresh rate.
version: 0.1.0
homepage: https://github.com/zephyr4289/Weft
repository: https://github.com/zephyr4289/Weft
issue_tracker: https://github.com/zephyr4289/Weft/issues

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  ffi: ^1.0.0
  flutter:
    sdk: flutter

dev_dependencies:
  lints: ^3.0.0
