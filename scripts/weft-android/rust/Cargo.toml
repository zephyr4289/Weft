[package]
name = "weft-core"
version = "0.1.0"
edition = "2021"
description = "Off-heap, zero-copy, draw-phase-read channel for declarative UI. Continuous-state plane spec v0.1."
license = "Apache-2.0"
repository = "https://github.com/zephyr4289/weft"
readme = "README.md"

# Build as both a static lib (for unit tests) and a cdylib (for Android .so).
[lib]
name = "weft_core"
crate-type = ["rlib", "cdylib"]

[dependencies]
# JNI bridge — used only when the "jni" feature is enabled.
jni = { version = "0.21", default-features = false, optional = true }
# Log to logcat via android_logger when building for Android.
log = "0.4"

[features]
default = []
# Enable JNI bindings (cdylib build for Android).
jni = ["dep:jni"]

# Profile tuned for an audio-rate hot path: no unwinding, opt-level 3, single codegen unit.
[profile.release]
opt-level = 3
panic = "abort"
codegen-units = 1
lto = "fat"
strip = "symbols"

[profile.dev]
opt-level = 1
