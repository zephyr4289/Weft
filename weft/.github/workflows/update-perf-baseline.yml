name: Update Perf Baseline

# Updates ci/baselines/wsuite-p99-baseline.json when a PR carries the
# "perf-baseline-update" label. The PR's W-suite output becomes the new
# pinned baseline that future runs compare against.
#
# This is the SAFETY VALVE for the perf-regression gate: it lets you
# intentionally update the baseline (e.g., after a protocol change that
# legitimately trades P99 for memory) without disabling the gate.

on:
  pull_request:
    types: [labeled, closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  update-baseline:
    name: Update W-suite P99 baseline
    if: contains(github.event.pull_request.labels.*.name, 'perf-baseline-update') && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install --quiet pyyaml psutil

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build C kernel for W-suite backend C
        run: cd core/c && gcc -O2 -std=c11 -Wall -Wextra -pthread -D_GNU_SOURCE -o libweft.so -fPIC -shared weft.c

      - name: Run W-suite to produce new baseline
        run: |
          PYTHONPATH=bench/workloads python3 bench/workloads/wsuite_runner.py \
            --workloads W1,W2,W3,W4,W5 --backends A,B,C,D \
            --measure-s 10 --warmup-s 2

      - name: Update baseline file
        run: |
          python3 -c "
          import json
          r = json.load(open('bench/results/wsuite-x86_64-sandbox.json'))
          baseline = {
              'cells': [
                  {'workload': c['workload'], 'backend': c['backend'], 'p99': c.get('fps_p99', 0)}
                  for c in r.get('cells', [])
              ],
              'note': 'Updated via PR #${{ github.event.pull_request.number }} (label: perf-baseline-update). Measure-s 10, warmup-s 2.',
              'updated_at': '${{ github.event.pull_request.merged_at }}',
              'updated_by': '${{ github.event.pull_request.user.login }}',
              'pr_sha': '${{ github.event.pull_request.merge_commit_sha }}',
          }
          with open('ci/baselines/wsuite-p99-baseline.json', 'w') as f:
              json.dump(baseline, f, indent=2)
          print(json.dumps(baseline, indent=2))
          "

      - name: Commit baseline update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git pull origin main
          git add ci/baselines/wsuite-p99-baseline.json
          git commit -m "perf(ci): update W-suite P99 baseline from PR #${{ github.event.pull_request.number }} [skip ci]"
          git push origin main

      - name: Comment on PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "### ✅ Perf baseline updated

          \`ci/baselines/wsuite-p99-baseline.json\` now pins the W-suite P99 values from this PR. Future CI runs will compare against this baseline.

          **Baseline cells:**
          $(python3 -c "
          import json
          b = json.load(open('ci/baselines/wsuite-p99-baseline.json'))
          for c in b['cells']:
              print(f'- {c[\"workload\"]}/{c[\"backend\"]}: P99 = {c[\"p99\"]}')
          ")"
          )"
